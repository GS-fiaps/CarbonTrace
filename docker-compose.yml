# =============================================================
# CarbonTrace — Global Solution 2026/1 — FIAP — 2TDSPG
# Serviços: Oracle XE 21c + CarbonTrace API (.NET 10)
# Uso: docker compose up -d
# =============================================================
services:

  # -----------------------------------------------------------
  # Banco de dados Oracle XE 21c (container slim)
  # -----------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db-rm561378
    environment:
      ORACLE_PASSWORD: "OracleRoot123"
      APP_USER: "carbontrace"
      APP_USER_PASSWORD: "carbontrace123"
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - carbontrace_net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # -----------------------------------------------------------
  # CarbonTrace API — .NET 10
  # -----------------------------------------------------------
  carbontrace-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pietrowilhelm/carbontrace-api:v3
    container_name: carbontrace-api-rm561378
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__CarbonTraceOracle=Data Source=oracle-db:1521/XEPDB1;User ID=carbontrace;Password=carbontrace123;
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - carbontrace_net
    restart: on-failure

# ---------------------------------------------------------------
# Volume nomeado para persistência dos dados do Oracle
# ---------------------------------------------------------------
volumes:
  oracle_data:
    name: oracle_data_carbontrace

# ---------------------------------------------------------------
# Rede interna dos serviços
# ---------------------------------------------------------------
networks:
  carbontrace_net:
    name: carbontrace_net